GLOVE_DIR: /opt/data/private/envs/glove

MODEL:
  ROI_RELATION_HEAD:
    USE_GT_BOX: True
    USE_GT_OBJECT_LABEL: True
    Middle_FEATS_DIM: 4096
    LAST_FEATS_DIM: 4096
    PREDICTOR: PENET_HTCL
    PREDICT_USE_BIAS: False
    BATCH_SIZE_PER_IMAGE: 512
  PRETRAINED_DETECTOR_CKPT: /opt/data/private/envs/pretrained_faster_rcnn/model_final.pth

  num_center_head_cls: 10
  num_beta: 0.9999
  cut_rels: 200
  PENET_wt: False
  reweight_fineloss: True
  ft_with_dist0: True
  semantic_embed_dim: 300
  ct_loss: True
  w_ct: 0.0001
  refine_mask_rate: 0.1
  refine_layers: 4
  Classifier_Finetuning: True
  Feats_resampling: True
  Rels_each_class: 5000
  max_bg_feats: 2000000

  BG_GATE:
    ENABLED: True
    HIDDEN_DIM: 64
    LOSS_WEIGHT: 0.1
    INFER_THRES: 0.5
    MARGIN: 0.0
    DETACH_COARSE: True
    APPLY_TO_HTCL_ONLY: True

  CONFLICT_REENTRY:
    ENABLED: True
    GROUPS_JSON: dcos/conflict_groups_v38.json
    REL_PROJ_DIM: 64
    REL_HIDDEN_DIM: 256
    STAT_CLASS_EMBED_DIM: 8
    MLP_HIDDEN_DIM: 128
    MLP_LOSS_WEIGHT: 0.12
    DISTILL_LOSS_WEIGHT: 0.02
    DISTILL_TEMPERATURE: 1.0
    PRIOR_TEMPERATURE: 1.2
    RECALL_THRESHOLD: 0.60
    ALPHA_BASE: 0.18
    ALPHA_INIT: (0.24, 0.22, 0.20, 0.18, 0.16, 0.14, 0.14)
    ALPHA_LEARNABLE: True
    BG_SUPPRESS_BETA: 0.08
    TRAIN_USE_BG_RECALLED_ONLY: True

TEST:
  IMS_PER_BATCH: 1
  ALLOW_LOAD_FROM_CACHE: False
  Save_eval_results: False
  COCO_mAp: False
  Eval_all_metrics: False
  Val_mode: mRecall

DTYPE: "float32"

TENSORBOARD:
  ENABLED: True
  LOG_DIR: /root/tf-logs

SOLVER:
  PRE_VAL: False
  Classifier_batch: 64
  Classifier_max_iter: 100000
  Classifier_checkpoint_period: 20000
  BASE_LR_ft: 0.000001
  cls_ft_STEPS: (60000,)

  VAL_PERIOD: 20000
  CHECKPOINT_PERIOD: 20000
  BASE_LR: 0.001
  GRAD_NORM_CLIP: 5.0
  MAX_ITER: 60000
  IMS_PER_BATCH: 8
  STEPS: (30000, 50000)
  SCHEDULE:
    TYPE: WarmupMultiStepLR
