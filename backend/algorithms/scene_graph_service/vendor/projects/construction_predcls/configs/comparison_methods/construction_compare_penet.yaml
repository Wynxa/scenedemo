PATHS_CATALOG: "projects/construction_predcls/config/construction_paths_catalog.py"
GLOVE_DIR: "/root/autodl-tmp/data/vg"

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHT: "catalog://ImageNetPretrained/MSRA/R-101"
  BACKBONE:
    CONV_BODY: "R-101-FPN"
  RESNETS:
    BACKBONE_OUT_CHANNELS: 512
  RELATION_ON: True
  ATTRIBUTE_ON: False
  FLIP_AUG: False
  PRETRAINED_DETECTOR_CKPT: "/root/autodl-tmp/pre/pretrained_faster_rcnn/model_0014000.pth"
  PENET_wt: False
  reweight_fineloss: True
  num_beta: 0.9999
  cut_rels: 200
  semantic_embed_dim: 300
  RPN:
    USE_FPN: True
    ANCHOR_SIZES: (16, 32, 64, 128, 256)
    ANCHOR_STRIDE: (4, 8, 16, 32, 64)
    ASPECT_RATIOS: (0.5, 1.0, 2.0)
    PRE_NMS_TOP_N_TRAIN: 6000
    PRE_NMS_TOP_N_TEST: 6000
    POST_NMS_TOP_N_TRAIN: 1000
    POST_NMS_TOP_N_TEST: 1000
    FPN_POST_NMS_TOP_N_TRAIN: 1000
    FPN_POST_NMS_TOP_N_TEST: 1000
    FPN_POST_NMS_PER_BATCH: False
    RPN_MID_CHANNEL: 512
  ROI_HEADS:
    USE_FPN: True
    POSITIVE_FRACTION: 0.5
    BG_IOU_THRESHOLD: 0.3
    BATCH_SIZE_PER_IMAGE: 256
    DETECTIONS_PER_IMG: 64
    NMS_FILTER_DUPLICATES: True
  ROI_BOX_HEAD:
    POOLER_RESOLUTION: 7
    POOLER_SCALES: (0.25, 0.125, 0.0625, 0.03125)
    POOLER_SAMPLING_RATIO: 2
    FEATURE_EXTRACTOR: "FPN2MLPFeatureExtractor"
    PREDICTOR: "FPNPredictor"
    NUM_CLASSES: 12
    MLP_HEAD_DIM: 4096
  ROI_ATTRIBUTE_HEAD:
    FEATURE_EXTRACTOR: "FPN2MLPFeatureExtractor"
    PREDICTOR: "FPNPredictor"
    USE_BINARY_LOSS: True
    POS_WEIGHT: 1.0
    ATTRIBUTE_LOSS_WEIGHT: 1.0
    NUM_ATTRIBUTES: 1
    MAX_ATTRIBUTES: 10
    ATTRIBUTE_BGFG_SAMPLE: True
    ATTRIBUTE_BGFG_RATIO: 3
  ROI_RELATION_HEAD:
    USE_GT_BOX: True
    USE_GT_OBJECT_LABEL: True
    NUM_CLASSES: 8
    BATCH_SIZE_PER_IMAGE: 64
    POSITIVE_FRACTION: 0.25
    CONTEXT_POOLING_DIM: 4096
    CONTEXT_HIDDEN_DIM: 512
    POOLING_ALL_LEVELS: True
    LABEL_SMOOTHING_LOSS: True
    FEATURE_EXTRACTOR: "RelationFeatureExtractor"
    PREDICTOR: "PENET"
    PREDICT_USE_BIAS: False
    Middle_FEATS_DIM: 4096
    LAST_FEATS_DIM: 4096
    CONTEXT_OBJ_LAYER: 1
    CONTEXT_REL_LAYER: 1
    TRANSFORMER:
      DROPOUT_RATE: 0.1
      OBJ_LAYER: 4
      REL_LAYER: 2
      NUM_HEAD: 8
      KEY_DIM: 64
      VAL_DIM: 64
      INNER_DIM: 2048

DATASETS:
  TRAIN: ("ConstructionVG_predcls_train",)
  VAL: ("ConstructionVG_predcls_test",)
  TEST: ("ConstructionVG_predcls_test",)
  debug_num_im: -1
  debug_num_val_im: 0

DATALOADER:
  SIZE_DIVISIBILITY: 32

SOLVER:
  PRE_VAL: True
  TO_VAL: True
  IMS_PER_BATCH: 8
  BIAS_LR_FACTOR: 1
  BASE_LR: 0.001
  WARMUP_FACTOR: 0.1
  WEIGHT_DECAY: 0.0001
  MOMENTUM: 0.9
  GRAD_NORM_CLIP: 5.0
  STEPS: (12000, 16000)
  MAX_ITER: 20000
  VAL_PERIOD: 20000
  CHECKPOINT_PERIOD: 20000
  PRINT_GRAD_FREQ: 5000
  SCHEDULE:
    TYPE: "WarmupReduceLROnPlateau"
    PATIENCE: 2
    THRESHOLD: 0.001
    COOLDOWN: 0
    FACTOR: 0.3
    MAX_DECAY_STEP: 4

OUTPUT_DIR: "./output/construction_predcls/comparison_methods/penet_lr1e3_b8"

TEST:
  IMS_PER_BATCH: 1
  ALLOW_LOAD_FROM_CACHE: False
  Save_eval_results: False
  COCO_mAp: False
  Eval_all_metrics: True
  Val_mode: mRecall
  RELATION:
    REQUIRE_OVERLAP: True
    LATER_NMS_PREDICTION_THRES: 0.5

DTYPE: "float32"

TENSORBOARD:
  ENABLED: False

CLASSIFIER_OUTPUT_DIR: ""
OUTPUT_DIR_feats: ""
