version: "3.8"

services:
  # MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: scene_behavior
      MYSQL_USER: ruoyi
      MYSQL_PASSWORD: ruoyi123
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ruoyi", "-pruoyi123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://ruoyi:ruoyi123@mysql:3306/scene_behavior
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-to-a-random-string
      JWT_SECRET_KEY: change-this-to-another-random-string
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/checkpoints:/app/checkpoints
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_worker worker --loglevel=info --pool=solo
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://ruoyi:ruoyi123@mysql:3306/scene_behavior
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/checkpoints:/app/checkpoints
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # Vue Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysqldata:
